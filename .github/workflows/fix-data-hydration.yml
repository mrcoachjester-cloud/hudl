name: Fix game data hydration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch App.tsx
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('artifacts/coach-hud/src/App.tsx')
          text = path.read_text()

          old_fetch = '''        let livePlays: Play[] = [];
          let scoutingPlays: Play[] = [];

          try {
            if (activeGameId) {
              const remoteLive = await getLivePlays(activeGameId);
              if (remoteLive.length > 0) {
                livePlays = remoteLive.map(livePlayToStandard);
              }
            }
          } catch (e) {
            console.warn('Could not fetch remote live plays:', e);
          }
'''

          new_fetch = '''        let livePlays: Play[] = [];
          let scoutingPlays: Play[] = [];
          const remoteGameData: Record<string, { scouting: Play[]; live: Play[] }> = {};

          try {
            const results = await Promise.all(
              games.map(async game => {
                try {
                  const remoteLive = await getLivePlays(game.id);
                  return [game.id, { scouting: [], live: remoteLive.map(livePlayToStandard) }] as const;
                } catch (e) {
                  console.warn(`Could not fetch live plays for game ${game.id}:`, e);
                  return [game.id, { scouting: [], live: [] }] as const;
                }
              }),
            );

            results.forEach(([gameId, gameData]) => {
              remoteGameData[gameId] = gameData;
            });

            if (activeGameId && remoteGameData[activeGameId]) {
              livePlays = remoteGameData[activeGameId].live;
              scoutingPlays = remoteGameData[activeGameId].scouting;
            }
          } catch (e) {
            console.warn('Could not fetch remote live plays:', e);
          }
'''

          if old_fetch not in text:
              raise SystemExit('Expected live-play hydration block was not found; no changes made.')
          text = text.replace(old_fetch, new_fetch, 1)

          old_state = '''        setDataState(current => {
          const gameData = {
            ...(current.gameData || {}),
            [activeGameId]: {
              scouting: current.gameData?.[activeGameId]?.scouting ?? (scoutingPlays.length ? scoutingPlays : current.scouting),
              live: livePlays.length ? livePlays : current.live,
            },
          };
          const nextDataset: Dataset = {
            ...current,
            schedule,
            activeGameId,
            scouting: gameData[activeGameId].scouting,
            live: gameData[activeGameId].live,
            gameData,
          };
          saveDataset(nextDataset);
          return nextDataset;
        });
'''

          new_state = '''        setDataState(current => {
          const gameData = {
            ...(current.gameData || {}),
            ...remoteGameData,
            [activeGameId]: {
              scouting: remoteGameData[activeGameId]?.scouting?.length
                ? remoteGameData[activeGameId].scouting
                : (current.gameData?.[activeGameId]?.scouting ?? (scoutingPlays.length ? scoutingPlays : current.scouting)),
              live: remoteGameData[activeGameId]?.live ?? (livePlays.length ? livePlays : current.live),
            },
          };
          const nextDataset: Dataset = {
            ...current,
            schedule,
            activeGameId,
            scouting: gameData[activeGameId].scouting,
            live: gameData[activeGameId].live,
            gameData,
          };
          saveDataset(nextDataset);
          return nextDataset;
        });
'''

          if old_state not in text:
              raise SystemExit('Expected dataset state block was not found; no changes made.')
          text = text.replace(old_state, new_state, 1)

          path.write_text(text)
          print('Patched App.tsx: hydrate live plays for every game and retain them by game_id.')
          PY

      - name: Verify patch
        run: |
          test -f artifacts/coach-hud/src/App.tsx
          grep -q "remoteGameData" artifacts/coach-hud/src/App.tsx

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/coach-hud/src/App.tsx .github/workflows/fix-data-hydration.yml
          git rm .github/workflows/fix-data-hydration.yml
          git commit -m "Fix game data hydration"
          git push
