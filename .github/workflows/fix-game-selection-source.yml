name: Fix game selection hydration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update App source
        shell: python
        run: |
          from pathlib import Path

          path = Path('artifacts/coach-hudl/src/App.tsx')
          source = path.read_text()

          old = '''        let livePlays: Play[] = [];
        let scoutingPlays: Play[] = [];

        try {
          if (activeGameId) {
            const remoteLive = await getLivePlays(activeGameId);
            if (remoteLive.length > 0) {
              livePlays = remoteLive.map(livePlayToStandard);
            }
          }
        } catch (e) {
          console.warn('Could not fetch remote live plays:', e);
        }
'''

          new = '''        const remoteGameData: Record<string, { scouting: Play[]; live: Play[] }> = {};
        const normalizeOpponent = (value: string | null | undefined) =>
          (value ?? '').trim().toLowerCase();

        // Hydrate every scheduled game once at startup. This makes game selection
        // a local state switch instead of leaving non-active games empty.
        const liveResults = await Promise.all(
          games.map(async game => {
            try {
              const remoteLive = await getLivePlays(game.id);
              return [game.id, remoteLive.map(livePlayToStandard)] as const;
            } catch (e) {
              console.warn(`Could not fetch live plays for game ${game.id}:`, e);
              return [game.id, null] as const;
            }
          }),
        );

        for (const [gameId, plays] of liveResults) {
          if (plays) {
            remoteGameData[gameId] = {
              scouting: remoteGameData[gameId]?.scouting ?? [],
              live: plays,
            };
          }
        }

        // Scouting sessions are opponent-based in older data. Paschal's session has
        // no game_id, so fall back to a normalized opponent-name match.
        if (currentSeason?.id) {
          try {
            const scoutingSessions = await getScoutingSessions(currentSeason.id);
            await Promise.all(
              scoutingSessions.map(async session => {
                try {
                  const remoteScouting = await getScoutingPlays(session.id);
                  const targetGame = session.game_id
                    ? games.find(game => game.id === session.game_id)
                    : games.find(
                        game =>
                          normalizeOpponent(game.opponent) ===
                          normalizeOpponent(session.opponent),
                      );

                  if (!targetGame) return;

                  remoteGameData[targetGame.id] = {
                    live: remoteGameData[targetGame.id]?.live ?? [],
                    scouting: remoteScouting.map(scoutingPlayToStandard),
                  };
                } catch (e) {
                  console.warn(
                    `Could not fetch scouting plays for session ${session.id}:`,
                    e,
                  );
                }
              }),
            );
          } catch (e) {
            console.warn('Could not fetch scouting sessions:', e);
          }
        }

        const livePlays = activeGameId
          ? remoteGameData[activeGameId]?.live ?? []
          : [];
        const scoutingPlays = activeGameId
          ? remoteGameData[activeGameId]?.scouting ?? []
          : [];
'''

          if old not in source:
              raise SystemExit('Expected Supabase hydration block was not found')
          source = source.replace(old, new, 1)

          old_merge = '''          const gameData = {
            ...(current.gameData || {}),
            [activeGameId]: {
              scouting: current.gameData?.[activeGameId]?.scouting ?? (scoutingPlays.length ? scoutingPlays : current.scouting),
              live: livePlays.length ? livePlays : current.live,
            },
          };
'''

          new_merge = '''          const gameData = {
            ...(current.gameData || {}),
            ...remoteGameData,
            [activeGameId]: {
              scouting:
                remoteGameData[activeGameId]?.scouting ??
                current.gameData?.[activeGameId]?.scouting ??
                current.scouting,
              live:
                remoteGameData[activeGameId]?.live ??
                current.gameData?.[activeGameId]?.live ??
                current.live,
            },
          };
'''

          if old_merge not in source:
              raise SystemExit('Expected gameData merge block was not found')
          source = source.replace(old_merge, new_merge, 1)
          path.write_text(source)

      - name: Commit source fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-game-selection-source.yml
          git add artifacts/coach-hudl/src/App.tsx
          git diff --cached --quiet || git commit -m "Fix Supabase game selection hydration"
          git push
