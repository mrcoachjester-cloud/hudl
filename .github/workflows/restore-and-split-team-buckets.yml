name: Restore and split team buckets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore-and-patch:
    if: ${{ !contains(github.event.head_commit.message, '[auto-team-bucket]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore App.tsx from the known-good parent
        run: git checkout d37ece050fc8778606dfa5a9754cc9fc71d30836 -- artifacts/coach-hudl/src/App.tsx

      - name: Apply focused scouting/live team split
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'artifacts/coach-hudl/src/App.tsx';
          let source = fs.readFileSync(path, 'utf8');

          source = source.replace(
            "import { getScoutingPlaysForTeam } from './lib/teamData';",
            "import { getScoutingPlaysForTeam, getScoutingTeamNames } from './lib/teamData';"
          );

          const start = source.indexOf('function UploadPage(');
          const end = source.indexOf('\nfunction ScoutPage(', start);
          if (start < 0 || end < 0) throw new Error('Could not locate UploadPage boundaries.');

          const page = source.slice(start, end);
          let updated = page;

          updated = updated.replace(
            "  const scheduleTeams = useMemo(() => Array.from(new Set(data.schedule.map(game => game.opponent.trim()).filter(Boolean))).sort(), [data.schedule]);\n  const [team, setTeam] = useState(data.activeTeam || scheduleTeams[0] || '');",
            "  const [scoutingTeams, setScoutingTeams] = useState<string[]>([]);\n  const [team, setTeam] = useState('');\n  const [newScoutingTeam, setNewScoutingTeam] = useState('');\n  const effectiveTeam = team === '__new__' ? newScoutingTeam.trim() : team;"
          );

          updated = updated.replace(
            "  const teamGame = useMemo(() => data.schedule.find(game => game.opponent.trim().toLowerCase() === team.trim().toLowerCase()), [data.schedule, team]);\n  const seasonYear = teamGame?.season || data.schedule[0]?.season || '';",
            "  const seasonYear = data.schedule.find(game => game.id === data.activeGameId)?.season || data.schedule[0]?.season || '';"
          );

          const effectStart = updated.indexOf('  useEffect(() => {');
          const effectEnd = updated.indexOf('\n  const selectTeam =', effectStart);
          if (effectStart < 0 || effectEnd < 0) throw new Error('Could not locate UploadPage team-loading effect.');

          updated = updated.slice(0, effectStart) + `  useEffect(() => {\n    let cancelled = false;\n    async function loadScouts() {\n      if (!seasonYear) { setScoutingTeams([]); setScouts([]); return; }\n      try {\n        const names = await getScoutingTeamNames(seasonYear);\n        if (cancelled) return;\n        setScoutingTeams(names);\n        const matchingActiveTeam = data.activeTeam && names.some(name => name.trim().toLowerCase() === data.activeTeam?.trim().toLowerCase()) ? data.activeTeam : '';\n        setTeam(current => current || matchingActiveTeam || '');\n        if (!effectiveTeam) { setScouts([]); return; }\n        const seasons = await getSeasons();\n        const season = seasons.find(item => String(item.season_year) === String(seasonYear));\n        if (!season) { setScouts([]); return; }\n        const sessions = await getScoutingSessions(season.id);\n        const filtered = sessions.filter(session => session.opponent.trim().toLowerCase() === effectiveTeam.trim().toLowerCase());\n        if (!cancelled) {\n          setScouts(filtered.map(session => ({ id: session.id, description: session.description, created_at: session.created_at })));\n          setScoutId(current => filtered.some(session => session.id === current) ? current : (filtered[0]?.id ?? 'new'));\n        }\n      } catch (error) {\n        console.error('Could not load scout files:', error);\n        if (!cancelled) { setScoutingTeams([]); setScouts([]); }\n      }\n    }\n    void loadScouts();\n    return () => { cancelled = true; };\n  }, [seasonYear, effectiveTeam, data.activeTeam]);\n` + updated.slice(effectEnd);

          const selectStart = updated.indexOf('  const selectTeam =');
          const handleStart = updated.indexOf('\n  const handleFile =', selectStart);
          if (selectStart < 0 || handleStart < 0) throw new Error('Could not locate UploadPage team selector handler.');
          updated = updated.slice(0, selectStart) + `  const selectTeam = (value: string) => {\n    setTeam(value);\n    setScoutId('new');\n    setPreview([]);\n    if (value !== '__new__') setNewScoutingTeam('');\n    if (value && value !== '__new__') setData({ ...data, activeTeam: value });\n  };\n` + updated.slice(handleStart);

          updated = updated.replace(/if \(!team\) \{ toast\.notify\('Select a Team before uploading\.'\); return; \}/, "if (!effectiveTeam) { toast.notify('Select or enter a Scouting Team before uploading.'); return; }");
          updated = updated.replace(/createScoutingSession\(\{ seasonId: season\.id, team, description:/, "createScoutingSession({ seasonId: season.id, team: effectiveTeam, description:");
          updated = updated.replace(/getScoutingPlaysForTeam\(seasonYear, team\)/, "getScoutingPlaysForTeam(seasonYear, effectiveTeam)");
          updated = updated.replace(/setData\(\{ \.\.\.data, activeTeam: team, scouting \}\)/, "setData({ ...data, activeTeam: effectiveTeam, scouting })");
          updated = updated.replace(/sessions\.filter\(session => session\.opponent\.trim\(\)\.toLowerCase\(\) === team\.trim\(\)\.toLowerCase\(\)\)/, "sessions.filter(session => session.opponent.trim().toLowerCase() === effectiveTeam.trim().toLowerCase())");

          updated = updated.replace(
            '<div><label className="eyebrow">Team</label><select value={team} onChange={event => selectTeam(event.target.value)} data-testid="select-data-room-team"><option value="">Select Team</option>{scheduleTeams.map(name => <option key={name} value={name}>{name}</option>)}</select></div>',
            '<div><label className="eyebrow">Scouting Team</label><select value={team} onChange={event => selectTeam(event.target.value)} data-testid="select-data-room-team"><option value="">Select Scouting Team</option>{scoutingTeams.map(name => <option key={name} value={name}>{name}</option>)}<option value="__new__">+ New Scouting Team</option></select></div>'
          );
          updated = updated.replace(
            "{scoutId === 'new' && <div><label className=\"eyebrow\">Scout File Name</label><input className=\"input\" value={newScoutName} onChange={event => setNewScoutName(event.target.value)} placeholder=\"Scout File 1\" /></div>}",
            "{team === '__new__' && <div><label className=\"eyebrow\">New Scouting Team</label><input className=\"input\" value={newScoutingTeam} onChange={event => setNewScoutingTeam(event.target.value)} placeholder=\"Paschal\" /></div>}{scoutId === 'new' && <div><label className=\"eyebrow\">Scout File Name</label><input className=\"input\" value={newScoutName} onChange={event => setNewScoutName(event.target.value)} placeholder=\"Scout File 1\" /></div>}"
          );
          updated = updated.replace('disabled={!team || loading}', 'disabled={!effectiveTeam || loading}');
          updated = updated.replace('<strong>{team || \'No team selected\'}</strong>', "<strong>{effectiveTeam || 'No scouting team selected'}</strong>");
          updated = updated.replace("Example: Data Room → Paschal → Scout File 1 → Upload Data.", "Example: Data Room → Scouting → Paschal → Scout File 1 → Upload Data.");
          updated = updated.replace('Team → Scout File → Upload', 'Scouting Team → Scout File → Upload');
          updated = updated.replace('Choose a team from your Schedule, choose its Scout File, then upload the scouting data into that file.', 'Choose a Scouting team, choose its Scout File, then upload the scouting data into that file. Live Game teams are intentionally kept out of this workflow.');

          source = source.slice(0, start) + updated + source.slice(end);
          fs.writeFileSync(path, source);
          NODE

      - name: Commit focused change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/coach-hudl/src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "[auto-team-bucket] Restore Data Room app and split scouting upload teams"
          git push
